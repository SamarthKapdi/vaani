# ==========================================================================
#  Vaani — Docker Compose (Local Development)
# ==========================================================================
services:
  vaani:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaani
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-whisper-large-v3}
    volumes:
      - ./app:/app/app
      - ./api:/app/api
    restart: unless-stopped
